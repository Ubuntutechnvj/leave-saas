<!DOCTYPE html>
<html>
<head>
<title>Leave System Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

.login-page {
    background: 
        linear-gradient(rgba(15,92,41,0.7), rgba(26,111,168,0.7)),
        url('background.jpg');

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: rgba(255, 255, 255, 0.95); 
    backdrop-filter: blur(6px); 
    
    padding: 40px 30px;
    border-radius: 12px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.25);

    width: 340px;
    text-align: center;
}

.login-box h2 {
    color: #0f5c29;
    margin-bottom: 8px;
    font-size: 22px;
}

.login-box p {
    color: #888;
    font-size: 13px;
    margin-bottom: 24px;
}

.form-group {
    text-align: left;
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #555;
    font-weight: bold;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 14px;
    transition: border 0.2s;
}

.login-wrapper {
    text-align: center;
}

.login-logo {
    width: 180px;
    margin-bottom: 20px;
}

input:focus {
    outline: none;
    border-color: #0f5c29;
}

button {
    background: #0f5c29;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    margin-top: 8px;
    transition: background 0.2s;
}

button:hover { background: #0a4520; }

button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

#errorMsg {
    color: #c0392b;
    font-size: 13px;
    margin-top: 12px;
    display: none;
}
</style>
</head>

<body class="login-page">

<div class="login-wrapper">
    
    <img src="company.jpg" class="login-logo">

    <div class="login-box">
        <h2>Leave System</h2>
        <p>Sign in to your account</p>

        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="you@company.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="password" type="password" placeholder="Enter your password">
        </div>

        <button type="button" id="loginBtn">Sign In</button>

        <p id="errorMsg"></p>
    </div>

</div>

<script>
const BASE = "https://leave-saas-1.onrender.com";

function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.innerText = msg;
    el.style.display = "block";
}

function hideError() {
    document.getElementById("errorMsg").style.display = "none";
}

function clearSession() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("employee_id");
    localStorage.removeItem("employee_name");
    localStorage.removeItem("role");
}

async function login() {
    hideError();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showError("Please enter your email and password");
        return;
    }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerText = "Signing in...";

    try {
        const response = await fetch(`${BASE}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            showError(data.detail || "Invalid email or password");
            return;
        }

        clearSession();

        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("employee_id", String(data.employee_id));
        localStorage.setItem("employee_name", data.name);
        localStorage.setItem("role", data.role);

        if (data.role === "admin" || data.role === "hr") {
            window.location.href = "hr_dashboard.html";
        } else if (data.role === "manager" || data.role === "supervisor" || data.role === "director") {
            window.location.href = "manager.html";
        } else {
            window.location.href = "index.html";
        }

    } catch (error) {
        console.error(error);
        showError("Cannot connect to server. Is FastAPI running?");
    } finally {
        btn.disabled = false;
        btn.innerText = "Sign In";
    }
}

document.getElementById("loginBtn").addEventListener("click", login);

document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") login();
});

document.getElementById("email").addEventListener("keydown", function(e) {
    if (e.key === "Enter") login();
});
</script>

</body>
</html>
